statement: >-
  A writer and editor, seeking to shed light on experiences our society would
  rather leave in the dark
portrait: portrait.PNG
portraitAlt: Placeholder portrait. Replace with a photo of Charlotte.
introduction: >
  The main reason I write is curiosity. I long to understand the world knowing I
  never will. I write again and again mostly as a conversation with myself, an
  attempt to understand how my brain experiences the world. Words may be the
  vehicle but they are brought to life by our shared experiences.


  Thanks for reading, for feeling, for being you.


  With love, Charlotte Rose
experience: >
  My first writing job was as a media intern on a Senate campaign when I was 15,
  I got involved in social justice young and this has influenced much of my
  writing. I have had works published in magazines, academic journals, and
  poetry anthologies. I have also written for campaigns and content for
  businesses. I believe art is the most powerful tool we have to bring people
  from all walks of life together, to share our experiences, and to inspire each
  other to shake up the status quo so that the freedom we feel within art can be
  felt everywhere.
