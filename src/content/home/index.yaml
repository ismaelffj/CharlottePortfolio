statement: A writer and editor drawn to memory, labor, and what the record leaves out.
portrait: portrait.jpg
portraitAlt: Placeholder portrait. Replace with a photo of Charlotte.
introduction: |
  I write essays and reporting about the places where the official story and the lived one don’t match, and poems about what’s left over. I want to spend my working life helping other people’s writing get where it deserves to go.
experience: |
  Reporting on housing and labor for *The Daily*, and essays for its weekend section.

  Poems in the campus literary review. Research writing in sociology, with one paper in a peer-reviewed journal.
