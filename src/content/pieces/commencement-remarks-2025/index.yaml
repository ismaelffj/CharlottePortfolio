title: "Commencement remarks, class of 2025"
kind:
  discriminant: prose
  value:
    outlet:
      name: ""
      url: ""
    body: |-
      I was asked to give you advice, and I have been trying for three weeks to think of some that you have not already heard from someone who loves you more than I do.

      Here is what I have. Most of what you will be asked to do in your life will be to fill in a form. The form will have boxes. The boxes will not fit you. This is not a mistake you have made. It is a mistake the form has made, and forms are made by people, and people can be asked to change them.

      So my advice is small. When a box does not fit, say so, out loud, to whoever is holding the pen. Half the time they will be grateful. The other half is how you find out who you are talking to.
