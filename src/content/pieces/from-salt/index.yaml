    body: |-
      The year they put the machine in the light, my father stopped sleeping and started counting. He counted the seconds between flashes, though the machine did not need him to. He counted the boats, though there were fewer every year. He counted the stairs, all one hundred and twelve, twice a night, up and down, as if the number might change if he stopped watching it.

      My mother said it was grief. My father said it was maintenance. I was eleven and thought it was a game, and played it with him for the first month, until I understood that he could not stop and I could.

      The machine had a small red eye that blinked when it was thinking. I have never seen anything so patient.
