title: "Letter, unsent"
kind:
  discriminant: poem
  value:
    form: "sonnet"
    poems:
      - title: ""
        verse: |-
          I wrote you in the margin of a bill,
          the only paper in the house that night,
          and folded it, and folded it, until
          the words were small enough to hold upright.

          I meant to send it. Then the winter came
          and took the road, and then the road came back
          and I was someone with a different name
          for what I wanted. So the fold went slack.

          It’s in the drawer now, with the rubber bands,
          the keys to nothing, and the birthday candle.
          Some evenings it is warm, as if the hands
          that folded it had left a kind of handle.

          I do not open it. I know the text.
          It says: I’ll write you properly, the next.
