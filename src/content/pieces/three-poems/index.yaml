title: Three poems
kind:
  discriminant: poem
  value:
    form: free verse
    poems:
      - title: What the river took
        verse: |
          What the river took
          it took at night,
          and left the door
          open for the cold.

          In the morning the kitchen
          smelled of somewhere else.
      - title: Inventory
        verse: |
          One chair. One bowl.
          The radio, which still works
          if you hold it.
