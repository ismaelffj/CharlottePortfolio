title: Freedom is just a word
kind:
  discriminant: poem
  value:
    form: Not For Hire Anthology
    poems:
      - title: Freedom is just a word
        verse: >
          Don’t step outside the line

          Just play along and you’ll be fine

          Freedom is only in your mind 


          You always knew this day would come

          Freedom is only an illusion 

          Don’t step outside the line 


          When it fades you’re left looking through the bars that you’re trapped
          behind 

          Out at the guard that’s gonna keep you in line 

          Freedom is only in your mind 


          A room with no windows 

          Safer when confined

          Don’t step outside the line 


          Taking what you’re advertised 

          All we’re ever told is lies 

          Freedom is only in your mind 


          Don’t ask why 

          Fall in line or serve some time 

          Don’t step outside the line 

          Freedom is only in your mind 


          —-----------


          Freedom is just another word until you feel it in your chest

          Question Everything 
