title: Life In The Mirror
kind:
  discriminant: poem
  value:
    form: 'Not For Hire Anthology '
    poems:
      - verse: >-
          Just a body. Under lights and with adornment you crave me. 4 am. I see
          myself but I don’t see what you see. You don’t crave this me. Bruised.
          Depleted. Aching. Lost. Restless. I’ll dance for you. I’m on top of
          you but I’m not really here. Fractured mirror. I broke it. You helped.
          One more bite. One more look. One more closed curtain. Pull up a
          chair. Front seat to my collapse. A smile all the while. Change the
          tune. This time the corner won’t keep me. Call me a viper. Call me a
          bitch. Tell me it was never true. I couldn’t be me so I became you.
