      url: https://example.com/the-daily/night-shift
    body: |
      The first truck leaves the yard at 11:40, twenty minutes before the shift officially starts, because Dolores likes to be at the on-ramp when the temperature drops. She has done this for nineteen years. The county pays her for eight hours a night and has never once asked what happens in the other twenty minutes.

      There are eleven people on the night crew. The county’s annual report lists six. The difference is not a clerical error; it is a category. Five of them are contractors, and contractors do not appear in the headcount, which means they do not appear in the budget line for winter operations, which means that when the state asks how many people it takes to keep this stretch of road open, the honest answer and the official one are different numbers.

      Nobody I spoke to seemed surprised by this. What surprised them was that I asked.
