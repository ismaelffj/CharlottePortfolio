    poems:
      - title: "Small hours"
        verse: |-
          Four in the morning is a room
          with the furniture pushed to the walls.

          You can hear the house deciding
          whether to keep standing.

          Somewhere a truck downshifts
          and takes the hill on faith.

          I am awake for no reason
          I would tell a doctor.

          The kettle knows. It clicks
          before I reach it, like a dog.
      - title: "Later"
        verse: |-
          By six the room has furniture again.
          The truck has become a road.

          Whatever I was holding
          I have set down somewhere obvious

          and will spend the day looking for it
          in all the other places.
