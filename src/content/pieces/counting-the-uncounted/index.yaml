    abstract: |-
      A method note on reconciling county payroll extracts with census employment tables when contract and seasonal workers are recorded in one and not the other. The note documents the matching rules used in a three-county study, the error rates of each rule against a hand-checked sample, and the two categories of worker that no rule recovered.
