    body: |-
      The ribbons are made in Ohio and arrive in a box that smells of cardboard and dye. Blue for first, red for second, white for third, and a purple rosette for the best in show that the judges argue about in a tent behind the rabbit barn.

      There are eleven categories in the home arts building. Quilts, canned goods, pies, bread, jams, pickles, honey, eggs, flowers, photographs, and a category listed on the entry form as “other,” which has had no entries since a woman named Ruth submitted a hand-carved chess set in 1994 and won.

      I spent the week with the judges, who are volunteers, and who take the work more seriously than most people take their jobs. The pie judge tastes forty pies in an afternoon and keeps notes in a composition book she has used since 2007. The notes are kinder than her face.

      By Sunday the ribbons are on the tables and the building is quiet. The chess set is still in the display case by the door, with its purple rosette, waiting for a challenger.
