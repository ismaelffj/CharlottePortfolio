    body: |-
      Nobody met her at the station because there was no station, only a bench where the station had been and a sign that said the bench was not a bus stop. Ada sat on it anyway. It was the first thing in town that had not changed.

      The car came after twenty minutes, driven by a cousin she had not seen since a funeral neither of them mentioned. He put her bag in the back seat instead of the trunk, which meant the trunk was full of something, which meant he had come from somewhere he did not want to explain.

      “You look the same,” he said, which was a lie, and she said, “So do you,” which was not.

      They drove past the mill, and she looked at it the way you look at a dog that bit you once: carefully, and with a certain respect.
