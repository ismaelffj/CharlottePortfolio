    body: |-
      The letter came in an envelope so thin she could read it before opening it, which she did anyway, out of respect. It offered her a job translating a language she had never heard of, for a client who could not be named, from documents that did not exist yet.

      She said yes because the fee was absurd and because the letter had been written by hand, and it had been years since anyone had bothered.

      The first document arrived a week later. It was one page. She recognized nine words, and none of them were next to each other.
