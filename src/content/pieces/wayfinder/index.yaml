title: Wayfinder
kind:
  discriminant: poem
  value:
    form: Not For Hire Anthology
    poems:
      - verse: >-
          The mind is not so much a fortress,

          As it is a window frame where moments pass by


          Through the candlelit windows, you could see her


          Dancing round the mansion at 3 am, in a sheer night gown that grazed
          the tops of her feet as she twirled, her long, unruly curls let loose
          had become her dance partner


          On a nearby table sat an espresso cup and a bar of her favorite
          chocolate. The record player spinning an album that had just come out
          that day


          Young and reckless


          Seeking adventure


          Meaning


          Feeling


          Seeking anything other than the cocktail of misery and apathy that had
          become her routine


          Lost


          She didn’t know what to do, where to go, or who to turn to


          No one had answers


          And she had tried to find them. Worn many masks. Did the work. Played
          the roles. Hit the marks. Nothing made sense


          It still doesn’t


          Listless in lace


          She met a pirate


          Mysterious, speaking in riddles, she was hooked


          Maybe he could show her a new way. Or at least be a fun distraction


          Saint Cecilia


          Crowns of roses and lilies


          Absurd and ephemeral


          A voyage past a blue moon


          Swinging out over the harbor


          Breeze in her hair


          She had not a care


          Far away from all she knew


          She never could tell if she was running towards something or running
          away


          Searching and searching


          Uncovering the wonders of life. The beauty


          As well as the sorrows. The depths


          For when you bleed, it reminds you that you are alive


          Years away and knowing what she now knows, she sees the girl dancing
          through the windows and smiles


          She didn’t know. She probably still doesn’t 


          But oh how she lived


          Passionately


          Unapologetically


          As if in slow motion


          Beating against the tides of time
