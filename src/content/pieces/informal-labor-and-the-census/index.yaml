title: Informal labor and the census
kind:
  discriminant: paper
  value:
    venue: Undergraduate thesis, Department of Sociology
    coauthors: ''
    abstract: |
      This thesis compares county payroll records with census employment figures for three rural counties between 2010 and 2020, and finds that seasonal and contract road workers are systematically absent from the official count. It argues that the gap is a product of category design rather than data collection, and proposes two changes to how contract labor is recorded.
