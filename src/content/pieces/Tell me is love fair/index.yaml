title: Tell me is love fair
kind:
  discriminant: poem
  value:
    poems:
      - verse: |-
          Tell me is love fair 

          I saw you standing there
          A flashback despair 

          Take your time 
          It’s all we have 

          We meet again 
          We collide 

          You keep showing up in every lifetime

          As soon as I crush my soul back into place
          You come and rip it out again 
          right in my face 

          Tell me is love fair 

          I recognize your darkness 
          You’ve become my sin 
          I’ll repent again and again 

          But truly I confess,
          When I gaze into your eyes I see every life time 

          Your absence the loudest silence I’ve ever heard 

          An eternity doesn’t seem to be enough 

          A mere moment 
          Years feel like minutes 

          Tell me is love fair 

          I miss you terribly until we meet again 

          Friend 
          Family
          Foe 
          Lover 

          Loathe me
          Love me
          Find me everytime 

          You kiss me like you used to 

          As sweet as the first time 
          Bitter as the last 

          Tell me is love fair 

          If hope is a game 
          I’ve become an expert 

          Passengers of time 
          Is it our stop yet 
          This journey relentless 

          Tell me is love fair 

          Tell me a story 
          Make it last
          Where we are each other’s 
          Past 
          Present 
          Future 

          Where separation never comes 

          Tell me is love fair 

          You’re in my head
          You’re in my bed 

          Candle wax melding together 
          Intertwined until the end of time 

          Desperation 
          Pure Bliss 

          I kiss you as if it is the last time 
          Your core bridged to mine 

          Tell me is love fair 

          Lay me bare 
          Say a prayer
          Consume me 
          Be my beginning and my end 

          Poisoned love 
          Your footsteps echo 

          Bury me deep
          Fight me 

          Be the only thing between me and death
          Create my world and destroy it 
          But love me 

          Find me 
          Find me
          Find me 

          I never left 

          Waiting 
          Waiting 
          Waiting 

          You are the ink that writes these words 

          Hold my hand through the veil 

          Walk through this storm
          Soak to the bone
          I’m sorry 

          Eternity awaits 

          Tell me is love fair 
