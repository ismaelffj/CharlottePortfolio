title: CAN YOU ESCAPE
kind:
  discriminant: poem
  value:
    form: Not For Hire Anthology
    poems:
      - verse: |-
          This reality is not mine
          I’ve merely borrowed this timeline 

          Not sure when its rightful owner shall return 

          I understand nothing 
          I used to seek to 

          No longer do I torment myself with a battle I’ve no chance of winning 

          Stuck in an echo chamber with my own thoughts 
          No one is listening 

          You see 
          But pretend you don’t 

          This timeline doesn’t belong to any of us 

          Get up 

          Work 

          Push all the nagging thoughts away 

          Sleep 

          Rinse and repeat 

          Sprawling highways 

          Carbon copy neighborhoods 

          Power lines 

          Dying trees 

          Someone asking for spare change 

          A child is born 
          Another child is slaughtered 

          The war machine lubricated with blood 
          The electricity kept on by silence 

          You speak of the future as if it is a guarantee 
          The future is a luxury concept 

          Walls are closing in 

          You have a choice to make 

          No one is helpless here 

          Look around 

          Everyone is stuck in a loop 

          An ending of quiet annihilation 

          Grab your neighbor’s hand 

          Walk out of the fog 

          The end is just a beginning 

          A beginning worth fighting for 
