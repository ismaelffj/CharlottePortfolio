    body: |-
      He paid in cash and in advance, which in Mrs. Hale’s experience meant one of two things, and she did not much care which. The room was at the top of the house, under the roof, with a window that looked at nothing and a radiator that had opinions.

      He said his name was Thomas. She wrote it in the book. In eleven years the book had never once been wrong about a name, which was to say it had never once been checked.

      The pipes froze on the ninth of January. She went up to tell him there would be no water until noon and found the door open and the room empty and the bed made with a precision that frightened her more than any mess.
