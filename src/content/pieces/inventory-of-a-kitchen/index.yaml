title: "Inventory of a kitchen"
kind:
  discriminant: poem
  value:
    form: "prose poem"
    poems:
      - title: ""
        verse: |-
          One chair. One bowl. The radio, which still works if you hold it. A calendar from the feed store, turned to March, though it is not March and has not been for some time. A drawer of string. A drawer that sticks. The good knife, which is the only knife, which she sharpened on the back step with a stone she brought from a river I have never seen. Two cups, one with a chip, and the rule that the chipped one is yours. A window. The light in it, which is not on the inventory, which is the only thing I came for.
